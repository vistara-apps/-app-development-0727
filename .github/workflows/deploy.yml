name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        
    - name: Check Vercel Secrets
      id: check-secrets
      run: |
        if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
          echo "missing=true" >> $GITHUB_OUTPUT
          echo "⚠️ Vercel deployment skipped: Missing required secrets (VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID)"
        else
          echo "missing=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Deploy to Vercel (Production)
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.check-secrets.outputs.missing == 'false'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Deploy to Vercel (Preview)
      if: (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') && steps.check-secrets.outputs.missing == 'false'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--no-wait'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Deployment Status
      if: steps.check-secrets.outputs.missing == 'true'
      run: |
        echo "🚀 Build completed successfully!"
        echo "📦 Application built and ready for deployment"
        echo "⚠️  Vercel deployment was skipped due to missing secrets"
        echo ""
        echo "To enable Vercel deployment, please configure the following repository secrets:"
        echo "  - VERCEL_TOKEN: Your Vercel API token"
        echo "  - VERCEL_ORG_ID: Your Vercel organization ID"
        echo "  - VERCEL_PROJECT_ID: Your Vercel project ID"
        echo ""
        echo "You can find these values in your Vercel dashboard and add them in:"
        echo "Repository Settings → Secrets and variables → Actions"
        
    - name: Comment PR with deployment URL
      if: github.event_name == 'pull_request' && steps.check-secrets.outputs.missing == 'false'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: deployments } = await github.rest.repos.listDeployments({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          const latestDeployment = deployments[0];
          if (latestDeployment) {
            const deploymentUrl = `https://${latestDeployment.environment}.vercel.app`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview Deployment Ready!**
              \n\n📱 **URL:** ${deploymentUrl}
              \n\nThis preview will be automatically updated when you push new commits to this PR.`
            });
          }
          
    - name: Comment PR with build status
      if: github.event_name == 'pull_request' && steps.check-secrets.outputs.missing == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **Build Completed Successfully!**
            \n\n📦 Your application has been built and is ready for deployment.
            \n\n⚠️ **Vercel deployment was skipped** due to missing repository secrets.
            \n\nTo enable automatic Vercel deployment, please configure these secrets in your repository settings:
            \n- \`VERCEL_TOKEN\`: Your Vercel API token
            \n- \`VERCEL_ORG_ID\`: Your Vercel organization ID  
            \n- \`VERCEL_PROJECT_ID\`: Your Vercel project ID
            \n\nYou can find these values in your [Vercel dashboard](https://vercel.com/dashboard) and add them in **Repository Settings → Secrets and variables → Actions**.`
          });
